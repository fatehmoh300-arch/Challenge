name: Challenge quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/challenge-platform-v1
      - chore/professional-workspace-setup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: challenge-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check workspace configuration
        run: npm run doctor

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test business rules
        run: npm run test:rules

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
