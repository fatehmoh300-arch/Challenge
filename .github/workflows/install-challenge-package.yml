name: Install Challenge platform source
on:
  push:
    branches:
      - feature/challenge-platform-v1
    paths:
      - challenge-platform.zip
permissions:
  contents: write
jobs:
  install-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/challenge-platform-v1
          persist-credentials: true
      - name: Extract application package
        run: |
          test -f challenge-platform.zip
          unzip -q challenge-platform.zip
          test -d challenge-platform
          cp -R challenge-platform/. .
          rm -rf challenge-platform challenge-platform.zip
      - name: Commit application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Challenge platform application source"
          git push origin HEAD:feature/challenge-platform-v1
