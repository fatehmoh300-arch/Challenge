name: Install Challenge platform source
on:
  push:
    branches:
      - feature/challenge-platform-v1
    paths:
      - 'challenge-platform*.zip'
permissions:
  contents: write
jobs:
  install-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/challenge-platform-v1
          persist-credentials: true
      - name: Extract application package
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'challenge-platform*.zip' -print -quit)"
          test -n "$archive"
          unzip -q "$archive"
          test -d challenge-platform
          cp -R challenge-platform/. .
          rm -rf challenge-platform "$archive"
      - name: Commit application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Challenge platform application source"
          git push origin HEAD:feature/challenge-platform-v1
